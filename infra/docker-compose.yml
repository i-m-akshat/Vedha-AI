services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vedha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vedha_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vedha_secret_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vedha_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vedha_admin} -d ${POSTGRES_DB:-vedha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vedha-network

  redis:
    image: redis:7-alpine
    container_name: vedha-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vedha-network

  nats:
    image: nats:latest
    container_name: vedha-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    networks:
      - vedha-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: vedha-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - vedha-network

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: vedha-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vedha_db};Username=${POSTGRES_USER:-vedha_admin};Password=${POSTGRES_PASSWORD:-vedha_secret_password_change_me};
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - NatsSettings__Url=${NATS_URL:-nats://nats:4222}
      - S3Settings__Endpoint=${MINIO_ENDPOINT:-minio:9000}
      - S3Settings__PublicEndpoint=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3Settings__AccessKey=${MINIO_ACCESS_KEY:-minioadmin}
      - S3Settings__SecretKey=${MINIO_SECRET_KEY:-minioadmin}
      - S3Settings__BucketName=${MINIO_BUCKET:-vedha-resumes}
      - S3Settings__UseSsl=${MINIO_USE_SSL:-false}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:-VedhaApi}
      - JwtSettings__Audience=${JWT_AUDIENCE:-VedhaClient}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-1440}
      - AiSettings__OpenAiApiKey=${OPENAI_API_KEY}
      - AiSettings__AnthropicApiKey=${ANTHROPIC_API_KEY}
      - AiSettings__GeminiApiKey=${GEMINI_API_KEY}
      - AiSettings__DefaultProvider=${DEFAULT_AI_PROVIDER:-Gemini}
      - AiSettings__DefaultModel=${DEFAULT_AI_MODEL:-gemini-flash-lite-latest}
      - AiSettings__MaxTokens=${AI_MAX_TOKENS:-16384}
      - Aksh__Enabled=${Aksh__Enabled:-false}
      - Aksh__DailyTokenBudget=${Aksh__DailyTokenBudget:-200000}
      - Aksh__Model=${Aksh__Model:-}
      - Crawl4AiSettings__BaseUrl=${CRAWLER_URL:-http://crawler:11235}
      - Crawl4AiSettings__Enabled=${CRAWLER_ENABLED:-true}
      - Crawl4AiSettings__ApiToken=${CRAWL4AI_API_TOKEN:-vedha_crawler_token_2026}
      - EnableSwagger=${ENABLE_SWAGGER:-true}
    ports:
      - "${APP_PORT:-5000}:8080"
    networks:
      - vedha-network

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: vedha-worker
    restart: unless-stopped
    depends_on:
      - nats
      - minio
    environment:
      - NATS_URL=nats://nats:4222
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-vedha-resumes}
      - AGENTQL_API_KEY=${AGENTQL_API_KEY}
      - RESIDENTIAL_PROXY_URL=${RESIDENTIAL_PROXY_URL}
      - WORKER_STEALTH_ENGINE=${WORKER_STEALTH_ENGINE:-patchright}
    networks:
      - vedha-network

  crawler:
    image: unclecode/crawl4ai:latest
    container_name: vedha-crawler
    restart: unless-stopped
    ports:
      - "${CRAWLER_PORT:-11235}:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-vedha_crawler_token_2026}
      - CRAWL4AI_HOOKS_ENABLED=true
    networks:
      - vedha-network

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: vedha-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - vedha-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vedha-network:
    name: infra_vedha-network
    driver: bridge
