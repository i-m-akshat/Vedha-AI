<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResuMate AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #09090b; color: #fafafa; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #27272a; padding-bottom: 12px; margin-bottom: 12px; }
    .logo { font-size: 14px; font-weight: 800; color: #6366f1; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); padding: 2px 6px; rounded: 4px; font-weight: 600; border-radius: 4px; }
    .job-card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    .job-title { font-size: 13px; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
    .job-company { font-size: 11px; color: #a1a1aa; }
    .source-tag { font-size: 10px; color: #34d399; margin-top: 6px; display: inline-block; }
    .btn { width: 100%; background: #4f46e5; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #4338ca; }
    .footer { font-size: 10px; color: #71717a; text-align: center; margin-top: 10px; }
    .status { font-size: 11px; color: #a1a1aa; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ ResuMate AI</div>
    <div class="badge" id="sourceBadge">Extension</div>
  </div>

  <div id="loading" class="status">Analyzing current job page...</div>

  <div id="content" style="display: none;">
    <div class="job-card">
      <div class="job-title" id="jobTitle">Job Title</div>
      <div class="job-company" id="jobCompany">Company</div>
      <div class="source-tag" id="jobSource">Detected: LinkedIn</div>
    </div>

    <button class="btn" id="sendBtn">Send to ResuMate AI Studio</button>
  </div>

  <div class="footer">Zero-Hallucination ATS Resume Optimization</div>

  <script src="popup.js"></script>
</body>
</html>
