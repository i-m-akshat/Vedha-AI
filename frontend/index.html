<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vedha-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vedha AI — The AI Career Operating System</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vedha_theme') || localStorage.getItem('resumate_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-zinc-900 dark:bg-[#0D0C13] dark:text-[#EDEDED] antialiased selection:bg-zinc-800 selection:text-white dark:selection:bg-white dark:selection:text-zinc-950 font-sans min-h-screen">

  </body>
</html>
